<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("warroom-theme");
        if (saved === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {
        // localStorage 不可用：靜默忽略，維持預設深色
      }
    })();
  </script>
  <title>戰情室 — 專案歷程詳情（靜態展示版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="戰情室單一專案縱向歷程，使用模擬資料呈現花費工時、每週進度達成率、測試問題趨勢與客訴議題狀態。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="dashboard-header">
    <div class="header-titles">
      <h1 class="dashboard-title">戰情室 <span>— 專案歷程詳情</span></h1>
      <p class="subtitle">靜態展示版（模擬資料） ·
        <a class="back-link" href="project-history-overview.html">返回總覽</a> ·
        <a class="back-link" href="index.html">返回入口頁</a>
      </p>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切換至淺色模式">🌙 深色</button>
  </header>

  <main>
    <div class="section-heading-row">
      <h2 id="detail-project-name">專案歷程</h2>
      <div class="control-group">
        <label for="project-select">專案：</label>
        <select id="project-select" name="project-select"></select>
      </div>
    </div>

    <section class="issue-section">
      <h2>花費工時趨勢</h2>
      <div id="work-hours-trend" class="trend-chart-wrap"></div>
    </section>

    <section class="issue-section">
      <h2>每週進度達成率（人時燃盡）</h2>
      <div id="burndown-chart" aria-live="polite"></div>
    </section>

    <section class="issue-section">
      <h2>測試問題趨勢</h2>
      <div id="testing-trend" class="trend-chart-wrap"></div>
    </section>

    <section class="issue-section">
      <h2>客訴議題狀態</h2>
      <div id="complaint-summary" aria-live="polite"></div>
    </section>
  </main>

  <script src="js/project-history-data.js"></script>
  <script src="js/project-history-detail.js"></script>
</body>
</html>
