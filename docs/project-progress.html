<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("warroom-theme");
        if (saved === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {
        // localStorage 不可用：靜默忽略，維持預設深色
      }
    })();
  </script>
  <title>戰情室 — 專案進度（靜態展示版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="戰情室專案進度靜態展示頁，使用模擬資料呈現各專案任務進度。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="dashboard-header">
    <div class="header-titles">
      <h1 class="dashboard-title">戰情室 <span>— 專案進度</span></h1>
      <p class="subtitle">靜態展示版（模擬資料） · <a class="back-link" href="index.html">返回入口頁</a></p>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切換至淺色模式">🌙 深色</button>
  </header>

  <main>
    <form class="project-selector" onsubmit="return false">
      <div class="control-group">
        <label for="project">選擇專案：</label>
        <select id="project" name="project"></select>
      </div>

      <fieldset class="type-filter" id="type-filter">
        <legend>任務類型</legend>
      </fieldset>

      <fieldset class="scope-filter">
        <legend>範圍</legend>
        <label><input type="radio" name="scope" value="all"> 全部</label>
        <label><input type="radio" name="scope" value="due_this_week" checked> 本週到期（含已逾期）</label>
        <label><input type="radio" name="scope" value="overdue"> 已逾期</label>
      </fieldset>

      <label class="incomplete-toggle">
        <input type="checkbox" id="incomplete-only" checked>
        只顯示未完成
      </label>

      <button type="button" id="apply-filters" class="apply-filters-btn">套用篩選</button>
    </form>

    <div id="summary" class="summary-bar" aria-live="polite"></div>

    <div id="content" aria-live="polite"></div>
  </main>

  <script src="js/project-progress.js"></script>
</body>
</html>
