<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("warroom-theme");
        if (saved === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {
        // localStorage 不可用：靜默忽略，維持預設深色
      }
    })();
  </script>
  <title>戰情室 — 入口頁</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="戰情室入口頁，選擇要查看的資料儀表板。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="dashboard-header">
    <div class="header-titles">
      <h1 class="dashboard-title">戰情室 <span>— 入口頁</span></h1>
      <p class="subtitle">靜態展示版（模擬資料）</p>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切換至淺色模式">🌙 深色</button>
  </header>

  <main>
    <div class="entry-grid">
      <a class="entry-card" href="project-progress.html">
        <h2>305 專案進度</h2>
        <p>依專案分組檢視任務進度、逾期與本週到期任務。</p>
      </a>
      <a class="entry-card" href="issues.html">
        <h2>306 臭蟲議題</h2>
        <p>月度／每日 KPI、議題明細、工程師負載與專案清單。</p>
      </a>
      <a class="entry-card" href="burndown.html">
        <h2>307 人時燃盡追蹤</h2>
        <p>依專案彙總與單一議題的理想／實際人時燃盡線，可依專案或人員篩選。</p>
      </a>
    </div>
  </main>

  <script src="js/entry.js"></script>
</body>
</html>
